<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Прототип сайта СЭВТ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: prototype chrome (toolbar + notes) around a resizable "site" frame; the site itself is greyscale wireframe with brand blue only on CTAs */
:root{
  --canvas:#e9ecf2; --paper:#ffffff; --ink:#111a28; --muted:#5a6577; --line:#d3d9e3;
  --ph:#eef1f6; --ph-line:#c9d0dc; --accent:#0120C1; --accent-ink:#ffffff; --navy:#03294E; --navy-ink:#eaf0f8;
  --note:#d9480f; --note-bg:#fff4e6; --ok:#2b8a3e;
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
/* single light theme by design (ТЗ: светлый дизайн) */
:root{color-scheme:light}

*{box-sizing:border-box}
body{background:var(--canvas);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;padding:0 16px;padding-block:0 40px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- prototype chrome ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--canvas);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:18px}
.bar h1{font-size:13px;font-weight:700;margin:0;letter-spacing:.02em;white-space:nowrap}
.bar h1 small{display:block;font:400 11px var(--f-mono);color:var(--muted);letter-spacing:0}
.seg{display:flex;flex-wrap:wrap;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--ink);background:var(--ph)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tgl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer}
.spacer{flex:1}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.stage.nonotes{grid-template-columns:minmax(0,1fr)}
@media (max-width:1100px){.stage{grid-template-columns:minmax(0,1fr)}}
.frame{margin:0 auto;width:100%;max-width:1440px;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:max-width .25s}
.frame[data-device="tablet"]{max-width:820px}
.frame[data-device="mobile"]{max-width:390px;border-radius:28px;border-width:8px;border-color:var(--ink)}
.frame-cap{font:400 11px var(--f-mono);color:var(--muted);text-align:center;margin:0 0 6px}

.notes{position:sticky;top:76px;background:var(--note-bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;max-height:calc(100vh - 100px);overflow:auto}
.notes h2{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--note);margin:0 0 10px}
.notes ol{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:12.5px}
.notes li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.notes li b{font-weight:600}
.stage.nonotes .notes{display:none}

.mk{position:absolute;top:8px;left:8px;z-index:5;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--note);color:#fff;font:500 11px/20px var(--f-mono);text-align:center;pointer-events:none}
.notes .mk{position:static;display:inline-block}
.stage.nonotes .site .mk{display:none}

/* ---------- the site (wireframe) ---------- */
.site{container-type:inline-size;container-name:site;color:var(--ink);font-weight:400}
.w{max-width:1200px;margin:0 auto;padding-inline:40px}
.blk{position:relative;padding-block:56px}
.blk + .blk{border-top:1px solid var(--line)}
.eyebrow{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px}
.h1{font-size:44px;line-height:1.1;font-weight:700;margin:0 0 16px;text-wrap:balance;letter-spacing:-.01em}
.h2{font-size:30px;line-height:1.2;font-weight:700;margin:0 0 12px;text-wrap:balance}
.h3{font-size:18px;line-height:1.3;font-weight:500;margin:0 0 6px}
.lead{font-size:17px;font-weight:300;color:var(--muted);max-width:62ch;margin:0 0 24px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.head-row{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.head-row > div{min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap;transition:filter .15s,background .15s,color .15s}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent);color:var(--accent-ink);filter:none}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.lnk{color:var(--accent);text-decoration:none;font-weight:500;cursor:pointer;background:none;border:0;padding:0}
.lnk:hover{text-decoration:underline}

.ph{position:relative;background:var(--ph);border:1px solid var(--ph-line);border-radius:6px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font:400 11.5px var(--f-mono);padding:8px;overflow:hidden;
  background-image:linear-gradient(to top right,transparent calc(50% - .5px),var(--ph-line) 50%,transparent calc(50% + .5px)),linear-gradient(to top left,transparent calc(50% - .5px),var(--ph-line) 50%,transparent calc(50% + .5px))}
.ph span{background:var(--ph);padding:2px 6px;border-radius:3px;position:relative}
.dash{border:1.5px dashed var(--ph-line);border-radius:8px;padding:14px 16px;color:var(--muted);font:400 12px var(--f-mono)}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink);background:var(--paper);white-space:nowrap}
.badge.mpt{border-color:var(--accent);color:var(--accent)}
.badge.mpt::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badges{display:flex;flex-wrap:wrap;gap:6px}

.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.card{border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:10px;background:var(--paper);transition:border-color .15s,box-shadow .15s;min-width:0}
a.card,.card.click{cursor:pointer;color:inherit;text-decoration:none}
a.card:hover,.card.click:hover{border-color:var(--accent);box-shadow:0 6px 20px -12px var(--accent)}

/* header */
.hdr{position:relative;border-bottom:1px solid var(--line);background:var(--paper);z-index:20}
.hdr .w{display:flex;align-items:center;gap:28px;height:72px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;flex:none}
.logo .ph{width:40px;height:40px;padding:0;font-size:9px}
.logo b{font-size:18px;letter-spacing:.06em}
.logo small{display:block;font-size:10.5px;color:var(--muted);font-weight:400;letter-spacing:0;line-height:1.2}
.nav{display:flex;gap:4px;flex:1;min-width:0}
.nav > div{position:relative}
.nav a{display:block;padding:8px 12px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500;cursor:pointer;white-space:nowrap}
.nav a:hover,.nav a.on{color:var(--accent)}
.nav a.on{box-shadow:inset 0 -2px 0 var(--accent);border-radius:0}
.dd{position:absolute;top:100%;left:0;min-width:260px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px;box-shadow:0 12px 30px -16px rgba(0,0,0,.35);opacity:0;visibility:hidden;transform:translateY(4px);transition:.15s}
.nav > div:hover .dd,.nav > div:focus-within .dd{opacity:1;visibility:visible;transform:none}
.dd a{font-weight:400}
.dd a:hover{background:var(--ph)}
.hdr-r{display:flex;align-items:center;gap:16px;flex:none}
.tel{font-weight:500;white-space:nowrap;user-select:all}
.burger{display:none;width:44px;height:44px;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer;flex:none;align-items:center;justify-content:center}
.burger i,.burger i::before,.burger i::after{display:block;width:18px;height:2px;background:var(--ink);position:relative}
.burger i::before,.burger i::after{content:"";position:absolute;left:0}
.burger i::before{top:-6px}.burger i::after{top:6px}
.drawer{display:none;border-bottom:1px solid var(--line);padding:12px 0 20px;background:var(--paper)}
.drawer.open{display:block}
.drawer a{display:block;padding:12px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:500;cursor:pointer}
.drawer a.sub{padding-left:16px;font-weight:400;color:var(--muted)}
.drawer .btn{width:100%;margin-top:16px}

/* crumbs */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--muted);padding-top:22px}
.crumbs a{color:var(--muted);cursor:pointer;text-decoration:none}
.crumbs a:hover{color:var(--accent)}
.crumbs span::before{content:"/";margin-right:6px}

/* home */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.hero .ph{aspect-ratio:5/4;max-width:100%}
.trust{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:8px}
.trust > div{padding:18px 20px;border-left:1px solid var(--line);min-width:0}
.trust > div:first-child{border-left:0}
.trust b{display:block;font-size:22px;font-weight:700;line-height:1.2}
.icon{width:44px;height:44px;border-radius:8px;flex:none}
.comp .ph{aspect-ratio:16/9}
.why{background:var(--navy);color:var(--navy-ink);border-top:0!important}
.why .muted,.why .eyebrow{color:var(--navy-ink);opacity:.75}
.why .num{font-size:34px;font-weight:700;line-height:1.1;margin-bottom:6px}
.why .card{background:transparent;border-color:rgba(255,255,255,.18)}
.about{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.about .phs{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:12px;aspect-ratio:4/3}
.about .phs .ph:first-child{grid-row:span 2}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:24px}
.facts b{display:block;font-size:26px;font-weight:700}
.logos{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.logos .ph{aspect-ratio:3/2}
.segs{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:20px;color:var(--muted);font-weight:500}
.cert .ph{aspect-ratio:3/4}
.cform{display:grid;grid-template-columns:.8fr 1.2fr;gap:48px}
.clist{display:grid;gap:16px;align-content:start}
.clist div b{display:block;font-size:12px;color:var(--muted);font-weight:400}

/* catalog */
.cat-tile{display:grid;grid-template-columns:1fr 200px;gap:20px;align-items:center;padding:28px}
.cat-tile .ph{aspect-ratio:1}
.cat-tile .h2{font-size:24px}
.prod .ph{aspect-ratio:4/3}
.prod ul{list-style:none;padding:0;margin:0;display:grid;gap:6px;font-size:13px}
.prod li{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px}
.g4 .prod li{grid-template-columns:1fr;gap:0}
.prod li i{font-style:normal;color:var(--muted)}
.prod .btns{margin-top:auto;padding-top:8px}
.prod .btns .btn{flex:1}
.prod.empty{border-style:dashed}

/* product page */
.pp-top{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.gal{display:grid;gap:10px}
.gal .main{aspect-ratio:4/3}
.gal .th{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.gal .th .ph{aspect-ratio:1;cursor:pointer}
.gal .th .ph:first-child{border-color:var(--accent)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px;margin:16px 0 20px}
.meta dt{color:var(--muted)}.meta dd{margin:0;font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;margin-top:24px}
.kpis div{padding:14px 16px;border-left:1px solid var(--line);min-width:0}
.kpis div:first-child{border-left:0}
.kpis b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpis span{font-size:12px;color:var(--muted)}
.specs{display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px;align-items:start}
.toc{position:sticky;top:16px;display:grid;gap:2px;font-size:13px}
.toc a{padding:7px 12px;border-left:2px solid var(--line);color:var(--muted);text-decoration:none;cursor:pointer}
.toc a:hover{color:var(--accent);border-color:var(--accent)}
.sgrp{margin-bottom:28px;min-width:0}
.sgrp h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.sgrp dl{margin:0;display:grid}
.sgrp dl > div{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.sgrp dt{color:var(--muted)}
.sgrp dd{margin:0;white-space:pre-line}
.dl-band{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:20px 24px;border:1px solid var(--line);border-radius:8px;background:var(--ph)}
.adv .icon{margin-bottom:6px}

/* solutions */
.sol{display:grid;grid-template-columns:260px minmax(0,1fr);gap:40px;padding-block:32px;border-top:1px solid var(--line)}
.sol:first-of-type{border-top:0}
.sol ul{margin:0;padding:0;list-style:none;display:grid;gap:14px}
.sol li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start;padding:16px 18px;border:1px solid var(--line);border-radius:8px}
details.case{margin-top:8px;font-size:13px}
details.case summary{cursor:pointer;color:var(--accent);font-weight:500}
details.case summary:hover{text-decoration:underline}
details.case .dash{margin-top:8px}

/* cta band + footer */
.cta{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;background:var(--navy);color:var(--navy-ink);border-radius:10px;padding:32px 36px}
.cta .h2{margin:0}
.cta p{margin:6px 0 0;opacity:.8}
.cta .btn.ghost{color:var(--navy-ink);border-color:var(--navy-ink)}
.cta .btn.ghost:hover{background:var(--navy-ink);color:var(--navy)}
.ftr{background:var(--navy);color:var(--navy-ink);padding-block:48px 24px;font-size:13px}
.ftr .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.3fr;gap:32px}
.ftr a{display:block;color:var(--navy-ink);opacity:.8;text-decoration:none;padding:3px 0;cursor:pointer}
.ftr a:hover{opacity:1;text-decoration:underline}
.ftr h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.6;font-weight:500}
.ftr .logo .ph{background-color:transparent;border-color:rgba(255,255,255,.3)}
.ftr .logo .ph span{background:var(--navy)}
.ftr .btn{margin-top:14px}
.ftr .bottom{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:36px;padding-top:18px;border-top:1px solid rgba(255,255,255,.15);opacity:.7;font-size:12px}

/* forms */
.form{display:grid;gap:14px}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{display:grid;gap:5px;font-size:12.5px;color:var(--muted)}
.fld input,.fld textarea{height:44px;border:1px solid var(--line);border-radius:6px;padding:0 12px;background:var(--paper);font-size:14px;color:var(--ink)}
.fld textarea{height:96px;padding:10px 12px;resize:vertical}
.fld input:hover,.fld textarea:hover{border-color:var(--muted)}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.file{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--line);border-radius:6px;padding:12px 14px;font-size:13px;cursor:pointer}
.file:hover{border-color:var(--accent)}
.file input{display:none}
.chk{display:flex;gap:10px;align-items:start;font-size:12.5px;color:var(--muted)}
.chk input{margin-top:2px;accent-color:var(--accent)}
.err{color:var(--note);font-size:12px;min-height:16px}
.done{display:grid;gap:8px;justify-items:start;padding:24px;border:1px solid var(--ok);border-radius:8px}
.done b{color:var(--ok)}

/* modal */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,12,24,.55)}
.modal[hidden]{display:none!important}
.mbox{position:relative;background:var(--paper);border-radius:12px;width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;padding:32px}
.mbox .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border:0;background:none;font-size:22px;cursor:pointer;border-radius:6px;color:var(--muted)}
.mbox .x:hover{background:var(--ph);color:var(--ink)}

/* sitemap */
.tree{display:grid;gap:14px}
.tree .lvl{display:flex;flex-wrap:wrap;gap:12px}
.node{border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:180px;flex:1;background:var(--paper);cursor:pointer;transition:border-color .15s}
.node:hover{border-color:var(--accent)}
.node b{display:block}
.node small{color:var(--muted);font-size:12px}
.node.root{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.node.root small{color:var(--paper);opacity:.7}
.node .kids{margin-top:10px;display:grid;gap:6px}
.node .kids span{display:block;font-size:12px;padding:6px 8px;border:1px dashed var(--ph-line);border-radius:5px}
.admin{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.admin ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}

/* ---------- container breakpoints (react to the frame, not the window) ---------- */
@container site (max-width: 1080px){
  .nav a{padding:8px 8px}
  .tel{display:none}
  .g5{grid-template-columns:repeat(3,minmax(0,1fr))}
  .trust{grid-template-columns:repeat(3,minmax(0,1fr))}
  .trust > div:nth-child(4){border-left:0}
  .trust > div:nth-child(n+4){border-top:1px solid var(--line)}
  .ftr .cols{grid-template-columns:1fr 1fr}
}
@container site (max-width: 900px){
  .w{padding-inline:24px}
  .nav,.hdr-r .btn{display:none}
  .burger{display:inline-flex}
  .hdr .w{justify-content:space-between}
  .h1{font-size:34px}.h2{font-size:26px}
  .hero,.about,.cform,.pp-top{grid-template-columns:1fr;gap:28px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .logos{grid-template-columns:repeat(3,minmax(0,1fr))}
  .specs{grid-template-columns:1fr}
  .toc{position:static;display:flex;overflow-x:auto;gap:4px;padding-bottom:6px}
  .toc a{border-left:0;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
  .sol{grid-template-columns:1fr;gap:16px}
  .admin{grid-template-columns:1fr}
}
@container site (max-width: 600px){
  .w{padding-inline:16px}
  .blk{padding-block:40px}
  .hdr .w{height:60px}
  .logo small{display:none}
  .h1{font-size:28px}.h2{font-size:22px}.lead{font-size:15px}
  .g2,.g3,.g4,.g5{grid-template-columns:1fr}
  .trust{grid-template-columns:1fr 1fr}
  .trust > div{border-left:0!important;border-top:1px solid var(--line)}
  .trust > div:nth-child(-n+2){border-top:0}
  .trust > div:nth-child(even){border-left:1px solid var(--line)!important}
  .trust b{font-size:18px}
  .facts{grid-template-columns:1fr 1fr 1fr}
  .facts b{font-size:20px}
  .logos{grid-template-columns:repeat(2,minmax(0,1fr))}

/* ---------- state & routing ---------- */
const state = {page:"home", pid:"lga4189", dev:"desktop", notes:false};
const order = ["home","products","category","product","solutions","contacts","sitemap"];
const $ = s => document.querySelector(s);
const site = $("#site"), frame = $("#frame"), stage = $("#stage");

$("#pages").innerHTML = order.map(k=>`<button data-page="${k}" aria-pressed="false">${PAGES[k].label}</button>`).join("");

function parseHash(){
  const h = (location.hash||"").slice(1);
  if (h.startsWith("product-")) { const id=h.slice(8); if (PRODUCTS[id]) { state.pid=id; return "product"; } }
  return PAGES[h] ? h : "home";
}
function go(page, opts={}){
  if (opts.pid) state.pid = opts.pid;
  const hash = page==="product" ? "product-"+state.pid : page;
  if (location.hash.slice(1)!==hash) { try{ history.replaceState(null,"","#"+hash); }catch(e){} }
  state.page = page; render(opts.anchor);
}
function render(anchor){
  const P = PAGES[state.page];
  site.innerHTML = P.render();
  document.querySelectorAll("#pages button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.page===state.page));
  const url = state.page==="product" ? `/products/servers/sevt-${state.pid}/` : P.url;
  const w = {desktop:"1440", tablet:"768", mobile:"375"}[state.dev];
  $("#cap").textContent = `savt.ru${url==="—"?"":url} · ${w} px`;
  $("#notes").innerHTML = `<h2>${P.label}${state.page==="product"?" · "+PRODUCTS[state.pid].name:""}</h2><ol>${P.notes.map(n=>`<li><span class="mk">${n[0]}</span><div><b>${n[1]}.</b> ${n[2]}</div></li>`).join("")}</ol>`;
  if (anchor) { const el = document.getElementById(anchor); if (el) { el.scrollIntoView({block:"start"}); return; } }
  frame.scrollIntoView({block:"start"}); window.scrollTo({top:0});
}

const modal = $("#modal");
function openKP(subject){
  $("#mbody").innerHTML = `<h2 class="h2" id="mtitle" style="font-size:24px">Запросить КП</h2><p class="muted" style="margin:0 0 18px">Ответим в течение 24 часов. Можно приложить техническое задание.</p>${formHTML("modal", subject||null)}`;
  modal.hidden = false; setTimeout(()=>{ const f=$("#modal-name"); f && f.focus(); },30);
}
function closeKP(){ modal.hidden = true; }
$("#mclose").onclick = closeKP;
modal.addEventListener("click", e=>{ if (e.target===modal) closeKP(); });
document.addEventListener("keydown", e=>{ if (e.key==="Escape" && !modal.hidden) closeKP(); });

/* ---------- interactions ---------- */
let toastT;
function flash(btn, text){ const old=btn.textContent; btn.textContent=text; clearTimeout(toastT); toastT=setTimeout(()=>btn.textContent=old,1800); }

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-go],[data-kp],[data-burger],[data-pdf],[data-scroll],[data-copy],[data-page],[data-dev]");
  if (!t) return;
  if (t.dataset.page){ go(t.dataset.page); return; }
  if (t.dataset.dev){ state.dev=t.dataset.dev; frame.dataset.device=state.dev; document.querySelectorAll("#devs button").forEach(b=>b.setAttribute("aria-pressed", b===t)); render(); return; }
  if (t.dataset.burger!==undefined){ const d=$("#drawer"); d && d.classList.toggle("open"); return; }
  if (t.dataset.kp!==undefined){ e.preventDefault(); openKP(t.dataset.kp); return; }
  if (t.dataset.pdf){ flash(t, "PDF скачивается…"); return; }
  if (t.dataset.scroll){ const el=document.getElementById(t.dataset.scroll); el && el.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if (t.dataset.copy!==undefined){
    const txt = `ООО «СЭВТ», ИНН ${CO.inn}, КПП ${CO.kpp}, ОГРН ${CO.ogrn}, ${CO.addr}`;
    try{ navigator.clipboard.writeText(txt).then(()=>flash(t,"Скопировано"),()=>flash(t,"Выделите текст вручную")); }catch(err){ flash(t,"Выделите текст вручную"); }
    return;
  }
  if (t.dataset.go){ e.preventDefault(); closeKP(); go(t.dataset.go, {pid:t.dataset.pid, anchor:t.dataset.anchor}); }
});

document.addEventListener("change", e=>{
  if (e.target.type==="file"){ const n=e.target.closest(".file").querySelector("[data-fname]"); n.textContent = e.target.files[0] ? e.target.files[0].name : "PDF, DOC, XLS до 20 МБ"; }
});
document.addEventListener("submit", e=>{
  const f = e.target.closest("[data-form]"); if (!f) return;
  e.preventDefault();
  const err = f.querySelector("[data-err]");
  const name=f.querySelector('[name="name"]').value.trim(), contact=f.querySelector('[name="contact"]').value.trim(), agree=f.querySelector('[name="agree"]').checked;
  if (!name || !contact){ err.textContent="Укажите имя и телефон или e-mail, чтобы мы могли ответить."; return; }
  if (!agree){ err.textContent="Отметьте согласие на обработку персональных данных."; return; }
  f.outerHTML = `<div class="done"><b>Заявка отправлена</b><span class="muted">Менеджер свяжется с вами в течение 24 часов. Прототип: заявка никуда не отправляется.</span></div>`;
});

$("#shownotes").addEventListener("change", e=>{ state.notes=e.target.checked; stage.classList.toggle("nonotes", !state.notes); });
window.addEventListener("hashchange", ()=>{ const p=parseHash(); if (p!==state.page || p==="product") { state.page=p; render(); } });

state.page = parseHash();
render();
</script>
</body>
</html>
